[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lookout"
dynamic = ["version"]
description = "Website monitoring with email alerts: price drops, restocks, keyword and page-change watches, and content digests"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Yussuf" }]
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "APScheduler>=3.10",
    "playwright>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
lookout = "lookout.cli:main"

[tool.setuptools.dynamic]
version = { attr = "lookout.__version__" }

[tool.setuptools.packages.find]
include = ["lookout*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
