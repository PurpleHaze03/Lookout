name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # The suite is fully offline -- no network, no browser -- so it runs in
  # seconds on every supported interpreter. The matrix is what actually
  # enforces requires-python = ">=3.10".
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Run the test suite
        run: pytest -q

  # The image runs the suite as a build step, so a green build here also means
  # Chromium and its system libraries installed correctly.
  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t lookout .

      - name: Check the CLI runs in the image
        run: docker run --rm lookout --version
